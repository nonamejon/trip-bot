name = "trip-bot"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Runs every minute: mock agent replies, agent-late reminders, flight reminders, closing finished trips.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "trip-bot"
database_id = "a6b9448f-7127-4913-9ea5-bc786dddc799"

[vars]
# Who uses the bot (Telegram user ids):
#   OWNER_ID: the maintainer. Uses the assistant, gets error alerts, and has the maintenance commands
#             (/alltrips /trip /log /jobs /now /fire /setstatus).
#   ADMIN_ID: people who use the assistant (comma-separated), e.g. Azizbek. They never see alerts or maintenance commands.
#   Each person has their own trips, calendar, reminders and chat. Anyone else gets "this is a private assistant".
OWNER_ID = "5503792899"
ADMIN_ID = "606554606,116590869"

# Where trip requests go:
#   "search" = no agent: the bot finds real flights and hotels itself (Gemini + Google Search) and shows them with booking links.
#   "group"  = a real travel agent in a Telegram group; set AGENT_CHAT_ID and add the bot to that group.
#   "mock"   = a fake travel agent answers automatically (for testing the agent flow alone).
AGENT_MODE = "search"
# Aviasales affiliate marker (Travelpayouts Partner ID): added to every Aviasales link so bookings earn commission.
# Real Aviasales fares need the TRAVELPAYOUTS_TOKEN secret (npx wrangler secret put TRAVELPAYOUTS_TOKEN).
TRAVELPAYOUTS_MARKER = "800005"
AGENT_CHAT_ID = ""
# "true" if the agent group has Topics turned on and the bot is an admin there: one topic per trip.
AGENT_TOPICS = "false"
# Language of messages to the travel agent: "uz" or "ru". (The owner picks his own with /uz or /ru.)
AGENT_LANG = "uz"
# Mock agent only: show the agent-group conversation inside your own chat so you can follow it.
MOCK_MIRROR = "true"
# Mock agent only: minutes before the mock agent answers.
MOCK_DELAY_MIN = "2"

GEMINI_MODEL = "gemini-3.8-flash"

# Timing rules (minutes). Lower them while testing.
AGENT_SLA_MIN = "240"   # agent should answer within this; then the bot reminds the agent
NUDGE_MIN = "120"       # unapproved request or unchosen options: remind the owner after this

# Public address of this Worker (used in the phone-calendar link).
PUBLIC_URL = "https://trip-bot.zsayidfozil.workers.dev"
# Local hour for the morning brief (today's plan), sent once a day before noon.
BRIEF_HOUR = "8"

# Local time of the owner, minutes from UTC (Tashkent = 300).
TZ_OFFSET_MIN = "300"

# Secrets (set with `npx wrangler secret put NAME`, never put them here):
# TELEGRAM_TOKEN, GEMINI_API_KEY, WEBHOOK_SECRET, PASSPORT_KEY

# Cloudflare Workers Logs: request and error history in the dashboard (Workers -> trip-bot -> Logs).
[observability]
enabled = true
